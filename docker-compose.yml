services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: swarm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d swarm"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: migrator
      PGHOST: postgres
      PGUSER: migrator
      PGDATABASE: swarm
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["bash", "/migrations/apply.sh"]

  test:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/swarm
      PYTHONPATH: /src
    volumes:
      - .:/src:ro
    working_dir: /src
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && pytest -p no:cacheprovider -v -s tests"]

  proxy-a:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    depends_on:
      postgres:
        condition: service_healthy
    environment: &proxy_env
      DATABASE_URL: postgresql://app:app@postgres:5432/swarm
      PYTHONPATH: /src
      PORT: "18894"
      PROXY_NAME: proxy-a
      PROXY_MODE: ${PROXY_MODE:-replay}
      PROVIDER_KEY: ${PROVIDER_KEY:-}
      PROVIDER_TPM: ${PROVIDER_TPM:-200000}
      PROVIDER_RPM: ${PROVIDER_RPM:-120}
      RECORDINGS_DIR: /src/recordings/steps
      LOCAL_BASE_URL: http://host.docker.internal:18894/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/src
    working_dir: /src
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && python -m proxy"]
    networks:
      - default
      - agents-t-a
      - agents-t-b
      - agents-t-c
      - agents-t-d
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18894/health')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 90s

  proxy-b:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *proxy_env
      PROXY_NAME: proxy-b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/src
    working_dir: /src
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && python -m proxy"]
    networks:
      - default
      - agents-t-a
      - agents-t-b
      - agents-t-c
      - agents-t-d
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18894/health')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 90s

  record:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    profiles: ["tools"]
    depends_on:
      proxy-a:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/swarm
      PYTHONPATH: /src
      PROXY_A_URL: http://proxy-a:18894
      LOCAL_BASE_URL: http://host.docker.internal:18894/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/src
    working_dir: /src
    networks:
      - default
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && python -m agent.record"]

  drill:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    profiles: ["tools"]
    depends_on:
      proxy-a:
        condition: service_healthy
      proxy-b:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/swarm
      PYTHONPATH: /src
      PROXY_A_URL: http://proxy-a:18894
      PROXY_B_URL: http://proxy-b:18894
      HOST_REPO: ${HOST_REPO}
    volumes:
      - .:/src
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /src
    networks:
      - default
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && python -m drill"]

  dispatch:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    profiles: ["tools"]
    depends_on:
      proxy-a:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/swarm
      PYTHONPATH: /src
      PROXY_A_URL: http://proxy-a:18894
      HOST_REPO: ${HOST_REPO}
    volumes:
      - .:/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /src
    networks:
      - default
    command: ["bash", "-c", "pip install -q --require-hashes -r requirements/services.lock && python -m runtime.dispatch"]

networks:
  agents-t-a:
    name: swarm-agents-t-a
    internal: true
    ipam:
      config:
        - subnet: 10.231.1.0/24
          ip_range: 10.231.1.0/29
  agents-t-b:
    name: swarm-agents-t-b
    internal: true
    ipam:
      config:
        - subnet: 10.231.2.0/24
          ip_range: 10.231.2.0/29
  agents-t-c:
    name: swarm-agents-t-c
    internal: true
    ipam:
      config:
        - subnet: 10.231.3.0/24
          ip_range: 10.231.3.0/29
  agents-t-d:
    name: swarm-agents-t-d
    internal: true
    ipam:
      config:
        - subnet: 10.231.4.0/24
          ip_range: 10.231.4.0/29

volumes:
  pgdata:
